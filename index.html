<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة BEST - للخدمات الشاملة</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #10b981;
            --primary-dark: #059669;
            --secondary: #1f2937;
            --bg-light: #f3f4f6;
            --white: #ffffff;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-light); color: var(--secondary); padding-bottom: 50px; }

        header { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: var(--white); padding: 25px 15px; text-align: center; box-shadow: var(--shadow); }
        header h1 { font-size: 2rem; margin-bottom: 5px; }
        header p { font-size: 0.95rem; opacity: 0.9; }

        .container { max-width: 1000px; margin: 20px auto; padding: 0 15px; }

        /* Control Panel for Admin/Agent */
        .admin-controls { background: var(--white); padding: 15px; border-radius: 10px; margin-bottom: 20px; box-shadow: var(--shadow); border-right: 5px solid var(--primary); }
        .admin-controls h3 { margin-bottom: 10px; font-size: 1.1rem; color: var(--secondary); }
        .admin-btn-group { display: flex; gap: 10px; flex-wrap: wrap; }
        
        button { cursor: pointer; border: none; padding: 10px 15px; border-radius: 6px; font-weight: bold; transition: 0.2s; }
        .btn-main { background: var(--primary); color: var(--white); }
        .btn-main:hover { background: var(--primary-dark); }
        .btn-danger { background: #ef4444; color: var(--white); }
        .btn-danger:hover { background: #dc2626; }
        .btn-secondary { background: #6b7280; color: var(--white); }

        /* Main Categories */
        .category-card { background: var(--white); border-radius: 10px; margin-bottom: 15px; box-shadow: var(--shadow); overflow: hidden; }
        .category-header { padding: 18px; background: #fff; display: flex; justify-content: space-between; align-items: center; cursor: pointer; border-bottom: 1px solid #eee; }
        .category-title { font-size: 1.2rem; font-weight: bold; display: flex; align-items: center; gap: 10px; }
        .badge { background: #e5e7eb; color: var(--secondary); padding: 3px 10px; border-radius: 12px; font-size: 0.85rem; }

        .subcategories { display: none; padding: 15px; background: #fafafa; }
        .subcategory-block { background: var(--white); border: 1px solid #e5e7eb; border-radius: 8px; padding: 12px; margin-bottom: 12px; }
        .subcategory-header { display: flex; justify-content: space-between; font-weight: bold; font-size: 1.05rem; margin-bottom: 10px; color: var(--primary-dark); }

        /* Service Item */
        .service-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px dashed #e5e7eb; }
        .service-item:last-child { border-bottom: none; }
        .service-actions { display: flex; gap: 8px; }

        /* Modal Forms */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: var(--white); padding: 25px; border-radius: 12px; width: 90%; max-width: 500px; max-height: 90vh; overflow-y: auto; }
        .modal-content h3 { margin-bottom: 15px; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; margin-bottom: 5px; font-size: 0.9rem; font-weight: bold; }
        .form-group input, .form-group select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 5px; }

        .rating { color: #f59e0b; margin-top: 4px; font-size: 0.85rem; }
    </style>
</head>
<body>

    <header>
        <h1>منصة BEST الخدماتية</h1>
        <p>منصتك الشاملة لجميع الخدمات والأعمال</p>
    </header>

    <div class="container">

        <!-- Admin / Agent Bar -->
        <div class="admin-controls">
            <h3><i class="fas fa-user-shield"></i> لوحة التحكم (المالك / المفوض)</h3>
            <div class="admin-btn-group">
                <button class="btn-main" onclick="openModal('addMainModal')"><i class="fas fa-plus"></i> إضافة قسم رئيسي</button>
                <button class="btn-main" onclick="openModal('addSubModal')"><i class="fas fa-folder-plus"></i> إضافة قسم فرعي</button>
            </div>
        </div>

        <!-- Categories List Container -->
        <div id="categoriesContainer"></div>

    </div>

    <!-- Modal Booking -->
    <div class="modal" id="bookingModal">
        <div class="modal-content">
            <h3><i class="fas fa-calendar-check"></i> طلب حجز خدمة</h3>
            <form id="bookingForm" onsubmit="submitBooking(event)">
                <div class="form-group">
                    <label>اسم العميل</label>
                    <input type="text" id="clientName" required>
                </div>
                <div class="form-group">
                    <label>رقم الجوال</label>
                    <input type="tel" id="clientPhone" required>
                </div>
                <div class="form-group">
                    <label>كود المفوض / المسوق (إن وجد)</label>
                    <input type="text" id="agentCode" placeholder="مثال: AGENT10">
                </div>
                <div class="form-group">
                    <label>موقع العميل (رابط Google Maps)</label>
                    <input type="url" id="clientLocation" placeholder="https://maps.google.com/...">
                </div>
                <button type="submit" class="btn-main" style="width: 100%;">تأكيد الطلب والحجز</button>
                <button type="button" class="btn-secondary" style="width: 100%; margin-top: 8px;" onclick="closeModal('bookingModal')">إلغاء</button>
            </form>
        </div>
    </div>

    <!-- Modal Add Main Category -->
    <div class="modal" id="addMainModal">
        <div class="modal-content">
            <h3>إضافة قسم رئيسي جديد</h3>
            <div class="form-group">
                <label>اسم القسم الرئيسي</label>
                <input type="text" id="newMainTitle">
            </div>
            <button class="btn-main" onclick="addMainCategory()">حفظ</button>
            <button class="btn-secondary" onclick="closeModal('addMainModal')">إلغاء</button>
        </div>
    </div>

    <script>
        // Initial Complete Structure
        let data = [
            {
                id: 1,
                title: "1. خدمات الأعمال والتقنية",
                subs: [
                    { name: "التقنية والبرمجة", services: ["تصميم وإنشاء مواقع وتطبيقات", "صيانة شبكات وكاميرات مراقبة", "صيانة جوالات وحاسب آلي"] },
                    { name: "التسويق والتصميم", services: ["إدارة حسابات التواصل الاجتماعي", "تصميم شعارات وهويات بصرية", "تصوير منتجات وإعلانات"] },
                    { name: "خدمات حكومية وإدارية", services: ["تعقيب معاملات وشؤون تجارية", "استشارات قانونية ومحاسبية"] }
                ]
            },
            {
                id: 2,
                title: "2. المقاولات والبناء",
                subs: [
                    { name: "البناء والتأسيس", services: ["المقاولات العامة والمباني (عظم / مفتاح)", "أعمال الحفر والردم والتأسيس", "حدادة مسلح وصبات خرسانية"] },
                    { name: "التشطيبات والديكور", services: ["دهانات وورق جدران وديكورات فوم", "تركيب سيراميك ورخام وباركيه", "أعمال جبس بورد وأسقف مستعارة", "واجهات زجاجية (ألومنيوم للشبابيك والأبواب)"] },
                    { name: "الترميم والصيانة المعمارية", services: ["ترميم وتجديد المنازل والمباني", "عزل اسطح وخزانات (مائي وحراري)"] }
                ]
            },
            {
                id: 3,
                title: "3. العقارات",
                subs: [
                    { name: "بيع العقارات", services: ["بيع اراضي مخططات وسكنية", "بيع فلل وشقق سكنية", "بيع عماير ومحلات تجارية"] },
                    { name: "إيجار العقارات", services: ["شقق وفلل للإيجار (سنوي / شهري)", "محلات ومكاتب ومستودعات للإيجار", "شقق مفروشة وشاليهات يومية"] },
                    { name: "إدارة واستثمار العقار", services: ["إدارة أملاك وصيانة عقارات", "تسويق وتقييم عقاري معتمد"] }
                ]
            },
            {
                id: 4,
                title: "4. البيع والشراء - حراج وشامل",
                subs: [
                    { name: "بيع وشراء السيارات والمركبات", services: ["سيارات جديدة ومستعملة للبيع", "قطع غيار وتشاليح", "معدات ثقيلة وشاحنات"] },
                    { name: "الأجهزة والإلكترونيات", services: ["جوالات وأجهزة ذكية", "أجهزة منزلية وكهربائية مستعملة وجديدة"] },
                    { name: "الأثاث والمستلزمات", services: ["أثاث منزلي ومكتبي للبيع", "معدات ومستلزمات محلات تجارية"] }
                ]
            },
            {
                id: 5,
                title: "5. المواد الغذائية والمطاعم",
                subs: [
                    { name: "المطاعم والمأكولات", services: ["وجبات سريعة (برجر / بيتزا / شاورما)", "مطاعم مأكولات شعبية وشواء", "مطابخ سحابية وأسر منتجة"] },
                    { name: "المقاهي والحلا", services: ["كافيهات وقهوة مختصة", "مخابز وحلويات شرقية وغربية"] },
                    { name: "المواد الغذائية والتموينات", services: ["سوبرماركت وتموينات مباشرة", "خضار وفواكه طازجة (جملة وتجزئة)", "لحوم ودواجن طازجة", "مصانع ومستودعات توزيع المياه"] }
                ]
            },
            {
                id: 6,
                title: "6. الصحة والمراكز الطبية",
                subs: [
                    { name: "المستشفيات والمراكز التخصصية", services: ["مستشفيات ومجمعات طبية عامة", "مراكز جراحة اليوم الواحد"] },
                    { name: "العيادات التخصصية", services: ["عيادات أسنان", "عيادات جلدية وليزر وتجميل", "عيادات عيون وتصحيح نظر"] },
                    { name: "الخدمات الطبية المساندة", services: ["صيدليات ومختبرات تحاليل", "رعاية صحية وتمريض منزلي"] }
                ]
            },
            {
                id: 7,
                title: "7. الخدمات المنزلية والصيانة",
                subs: [
                    { name: "صيانة وإصلاح", services: ["صيانة وتنظيف مكيفات (سبليت / شباك / مركزي)", "سباكة وتأسيس شبكات مياه", "كهرباء منازل وإضاءة", "صيانة أجهزة منزلية"] },
                    { name: "نظافة وتعقيم", services: ["تنظيف منازل وفلل", "غسيل سجاد ومجالس بالبخار", "مكافحة حشرات ورش مبيدات"] }
                ]
            },
            {
                id: 8,
                title: "8. خدمات السيارات والنقل",
                subs: [
                    { name: "صيانة ورش السيارات", services: ["ميكانيكا وفحص كمبيوتر", "كهرباء سيارات وبطاريات", "تغيير زيوت وإطارات"] },
                    { name: "النقل واللوجستيات", services: ["سطحات نقل سيارات (عادية / هيدروليك)", "نقل عفش وتغليف أثاث", "دينا وشحن بين المدن"] }
                ]
            }
        ];

        function renderCategories() {
            const container = document.getElementById('categoriesContainer');
            container.innerHTML = '';

            data.forEach((cat, index) => {
                let totalServices = cat.subs.reduce((acc, sub) => acc + sub.services.length, 0);

                let catHTML = `
                    <div class="category-card">
                        <div class="category-header" onclick="toggleCategory(${index})">
                            <div class="category-title">
                                <i class="fas fa-folder"></i> ${cat.title}
                            </div>
                            <div>
                                <span class="badge">${totalServices} خدمة</span>
                                <button class="btn-danger" style="padding:4px 8px; font-size:0.8rem;" onclick="event.stopPropagation(); deleteMainCategory(${index})"><i class="fas fa-trash"></i></button>
                            </div>
                        </div>
                        <div class="subcategories" id="sub-${index}">
                `;

                cat.subs.forEach((sub, subIndex) => {
                    catHTML += `
                        <div class="subcategory-block">
                            <div class="subcategory-header">
                                <span>📂 ${sub.name} (${sub.services.length})</span>
                            </div>
                    `;

                    sub.services.forEach((service) => {
                        catHTML += `
                            <div class="service-item">
                                <div>
                                    <span>🔹 ${service}</span>
                                    <div class="rating"><i class="fas fa-star"></i> 5.0 (تقييم ممتاز)</div>
                                </div>
                                <div class="service-actions">
                                    <button class="btn-main" style="padding: 4px 8px; font-size: 0.8rem;" onclick="openModal('bookingModal')">حجز</button>
                                </div>
                            </div>
                        `;
                    });

                    catHTML += `</div>`;
                });

                catHTML += `</div></div>`;
                container.innerHTML += catHTML;
            });
        }

        function toggleCategory(index) {
            const el = document.getElementById(`sub-${index}`);
            el.style.display = el.style.display === 'block' ? 'none' : 'block';
        }

        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        function addMainCategory() {
            const title = document.getElementById('newMainTitle').value;
            if(title) {
                data.push({ id: Date.now(), title: title, subs: [] });
                renderCategories();
                closeModal('addMainModal');
                document.getElementById('newMainTitle').value = '';
            }
        }

        function deleteMainCategory(index) {
            if(confirm("هل أنت تأكد من رغبتك في حذف هذا القسم بجميع محتوياته؟")) {
                data.splice(index, 1);
                renderCategories();
            }
        }

        function submitBooking(e) {
            e.preventDefault();
            alert("تم إرسال طلب الحجز بنجاح ومشاركته مع التاجر والمفوض!");
            closeModal('bookingModal');
        }

        // Initialize Render
        renderCategories();
    </script>
</body>
</html>
