<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>منصة BEST - المنظومة الكاملة المكتملة</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-gray-100 font-sans">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // 1. قاعدة البيانات والمناطق
    const SAUDI_REGIONS = [
      { id: 'jazan', name: 'منطقة جازان', cities: ['جازان', 'أبو عريش', 'صامطة', 'صبيا', 'بيش', 'أحد المسارحة', 'الدرب'] },
      { id: 'riyadh', name: 'منطقة الرياض', cities: ['الرياض', 'الخرج', 'الدرعية', 'المجمعة'] },
      { id: 'makkah', name: 'منطقة مكة المكرمة', cities: ['مكة المكرمة', 'جدة', 'الطائف'] }
    ];

    const INITIAL_LISTINGS = [
      {
        id: 1,
        title: 'توريد وتركيب أجهزة تكييف سبليت',
        price: 1500,
        region: 'منطقة جازان',
        city: 'أبو عريش',
        phone: '966500000000',
        description: 'تركيب وصيانة جميع أنواع التكييف بضمان شامل وصيانة دورية.',
        status: 'مقبول',
        lat: 16.9691,
        lng: 42.8314,
        avg_rating: 4.8,
        reviews_count: 2,
        reviews: [
          { id: 101, user: 'أحمد السعيد', rating: 5, comment: 'خدمة ممتازة وسريعة.' },
          { id: 102, user: 'محمد علي', rating: 4.5, comment: 'أسعار مناسبة وشغل نظيف.' }
        ]
      }
    ];

    function App() {
      // إدارات النظام: 'user' | 'supervisor' | 'owner'
      const [currentUser, setCurrentUser] = useState({ role: 'user', name: 'زائر / مستخدم' });
      const [currentTab, setCurrentTab] = useState('home'); // 'home' | 'supervisor_panel' | 'owner_panel'
      
      const [listings, setListings] = useState(INITIAL_LISTINGS);
      const [reports, setReports] = useState([]);
      const [supervisors, setSupervisors] = useState([
        { id: 1, name: 'مشرف جازان', phone: '966555555555', status: 'نشط' },
        { id: 2, name: 'مشرف الرياض', phone: '966544444444', status: 'نشط' }
      ]);

      // الفلاتر
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedRegion, setSelectedRegion] = useState('');
      const [selectedCity, setSelectedCity] = useState('');
      const [userCoords, setUserCoords] = useState(null);

      // النوافذ
      const [isCreateOpen, setIsCreateOpen] = useState(false);
      const [selectedListing, setSelectedListing] = useState(null);
      const [reportingListing, setReportingListing] = useState(null);
      const [showAuthModal, setShowAuthModal] = useState(null); // 'supervisor' | 'owner'

      useEffect(() => {
        if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition(
            (pos) => setUserCoords({ lat: pos.coords.latitude, lng: pos.coords.longitude }),
            () => console.log('تعذر التحديد الآلي للموقع')
          );
        }
      }, []);

      const activeRegionObj = SAUDI_REGIONS.find((r) => r.name === selectedRegion);

      const filteredListings = listings.filter((item) => {
        const matchesSearch = item.title.includes(searchQuery) || item.description.includes(searchQuery);
        const matchesRegion = selectedRegion ? item.region === selectedRegion : true;
        const matchesCity = selectedCity ? item.city === selectedCity : true;
        return matchesSearch && matchesRegion && matchesCity;
      });

      // ➕ إضافة إعلان
      const handleAddListing = (newListing) => {
        setListings([newListing, ...listings]);
      };

      // 🗑️ حذف إعلان
      const handleDeleteListing = (id) => {
        if (confirm('هل أنت تأكد من رغبتك في حذف هذا الإعلان نهائياً؟')) {
          setListings(listings.filter(item => item.id !== id));
          setReports(reports.filter(r => r.listingId !== id));
          if (selectedListing && selectedListing.id === id) setSelectedListing(null);
        }
      };

      // 🚩 إضافة بلاغ
      const handleAddReport = (report) => {
        setReports([report, ...reports]);
        alert('تم رفع البلاغ بنجاح إلى لوحة المشرف والمالك ✅');
      };

      // ⭐ إضافة تقييم
      const handleAddReview = (listingId, newReview) => {
        setListings(listings.map(item => {
          if (item.id === listingId) {
            const updatedReviews = [newReview, ...item.reviews];
            const newAvg = (updatedReviews.reduce((acc, r) => acc + r.rating, 0) / updatedReviews.length).toFixed(1);
            const updatedItem = {
              ...item,
              reviews: updatedReviews,
              reviews_count: updatedReviews.length,
              avg_rating: parseFloat(newAvg)
            };
            if (selectedListing && selectedListing.id === listingId) setSelectedListing(updatedItem);
            return updatedItem;
          }
          return item;
        }));
      };

      // تسجيل الدخول بالصلاحيات
      const handleLogin = (role, pass) => {
        if (pass === '1234') {
          if (role === 'owner') {
            setCurrentUser({ role: 'owner', name: '👑 المالك الرئيسي' });
            setCurrentTab('owner_panel');
          } else {
            setCurrentUser({ role: 'supervisor', name: '🛡️ المشرف العام' });
            setCurrentTab('supervisor_panel');
          }
          setShowAuthModal(null);
        } else {
          alert('كلمة المرور خاطئة (جرب: 1234)');
        }
      };

      const handleLogout = () => {
        setCurrentUser({ role: 'user', name: 'زائر / مستخدم' });
        setCurrentTab('home');
      };

      return (
        <div className="min-h-screen bg-gray-100 p-3 md:p-8">
          
          {/* 🔝 الهيدر الرئيسي مع بوابة دخول المالك والمشرف */}
          <header className="max-w-6xl mx-auto bg-white p-4 rounded-xl shadow-sm mb-6 flex flex-wrap justify-between items-center gap-4 border">
            <div>
              <h1 className="text-2xl font-black text-blue-600">منصة BEST</h1>
              <p className="text-xs text-gray-500">
                الحساب الحالي: <span className="font-bold text-gray-800">{currentUser.name}</span>
              </p>
            </div>

            {/* الأزرار العلوية والتنقل بين اللوحات */}
            <div className="flex items-center gap-2 flex-wrap">
              <button 
                onClick={() => setCurrentTab('home')} 
                className={`text-xs px-3 py-2 rounded-lg font-bold ${currentTab === 'home' ? 'bg-blue-600 text-white' : 'bg-gray-100 text-gray-700'}`}
              >
                🏠 الرئيسية والإعلانات
              </button>

              {currentUser.role === 'supervisor' && (
                <button 
                  onClick={() => setCurrentTab('supervisor_panel')} 
                  className={`text-xs px-3 py-2 rounded-lg font-bold ${currentTab === 'supervisor_panel' ? 'bg-blue-600 text-white' : 'bg-blue-50 text-blue-700'}`}
                >
                  🛡️ لوحة المشرف ({reports.length})
                </button>
              )}

              {currentUser.role === 'owner' && (
                <>
                  <button 
                    onClick={() => setCurrentTab('supervisor_panel')} 
                    className={`text-xs px-3 py-2 rounded-lg font-bold ${currentTab === 'supervisor_panel' ? 'bg-blue-600 text-white' : 'bg-blue-50 text-blue-700'}`}
                  >
                    🛡️ إدارة البلاغات
                  </button>
                  <button 
                    onClick={() => setCurrentTab('owner_panel')} 
                    className={`text-xs px-3 py-2 rounded-lg font-bold ${currentTab === 'owner_panel' ? 'bg-amber-600 text-white' : 'bg-amber-50 text-amber-800 border border-amber-300'}`}
                  >
                    👑 لوحة المالك
                  </button>
                </>
              )}

              {currentUser.role === 'user' ? (
                <div className="flex gap-1 border-r pr-2 mr-1">
                  <button onClick={() => setShowAuthModal('supervisor')} className="bg-gray-100 hover:bg-gray-200 text-gray-700 text-xs px-2.5 py-1.5 rounded font-bold">
                    🔑 دخول المشرف
                  </button>
                  <button onClick={() => setShowAuthModal('owner')} className="bg-amber-100 hover:bg-amber-200 text-amber-900 text-xs px-2.5 py-1.5 rounded font-bold">
                    👑 دخول المالك
                  </button>
                </div>
              ) : (
                <button onClick={handleLogout} className="bg-red-50 text-red-600 text-xs px-3 py-2 rounded-lg font-bold hover:bg-red-100">
                  🚪 خروج
                </button>
              )}

              <button
                onClick={() => setIsCreateOpen(true)}
                className="bg-blue-600 hover:bg-blue-700 text-white text-xs md:text-sm font-bold px-3 py-2 rounded-lg transition"
              >
                + إضافة إعلان
              </button>
            </div>
          </header>

          <main className="max-w-6xl mx-auto">

            {/* 👑 1. لوحة المالك المستقلة (تفاصيل الشاشات والإحصائيات وإدارة المشرفين) */}
            {currentTab === 'owner_panel' && currentUser.role === 'owner' && (
              <div className="space-y-6">
                <div className="bg-amber-500 text-white p-6 rounded-xl shadow-md flex justify-between items-center">
                  <div>
                    <h2 className="text-xl font-black">👑 لوحة التحكم العليا للمالك</h2>
                    <p className="text-xs opacity-90">إشراف كامل على الإعلانات، المشرفين، والتقارير المالية</p>
                  </div>
                  <span className="bg-white/20 px-3 py-1 rounded-full text-xs font-bold">صلاحيات كاملة</span>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-4 gap-4 text-center">
                  <div className="bg-white p-4 rounded-xl shadow-sm border">
                    <p className="text-xs text-gray-500">إجمالي الإعلانات</p>

                    <p className="text-2xl font-black text-blue-600">{listings.length}</p>
                  </div>
                  <div className="bg-white p-4 rounded-xl shadow-sm border">
                    <p className="text-xs text-gray-500">البلاغات المعلقة</p>
                    <p className="text-2xl font-black text-red-600">{reports.length}</p>
                  </div>
                  <div className="bg-white p-4 rounded-xl shadow-sm border">
                    <p className="text-xs text-gray-500">عدد المشرفين</p>
                    <p className="text-2xl font-black text-emerald-600">{supervisors.length}</p>
                  </div>
                  <div className="bg-white p-4 rounded-xl shadow-sm border">
                    <p className="text-xs text-gray-500">إجمالي التقييمات</p>
                    <p className="text-2xl font-black text-amber-500">
                      {listings.reduce((acc, item) => acc + item.reviews_count, 0)}
                    </p>
                  </div>
                </div>

                {/* إدارة المشرفين */}
                <div className="bg-white p-5 rounded-xl shadow-sm border space-y-4">
                  <h3 className="font-bold text-gray-800 text-sm">👥 قائمة المشرفين المعينين في النظام</h3>
                  <div className="space-y-2">
                    {supervisors.map(sup => (
                      <div key={sup.id} className="flex justify-between items-center bg-gray-50 p-3 rounded-lg border text-xs">
                        <div>
                          <p className="font-bold text-gray-800">{sup.name}</p>
                          <p className="text-gray-500">{sup.phone}</p>
                        </div>
                        <span className="bg-green-100 text-green-800 px-2 py-1 rounded font-bold">{sup.status}</span>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {/* 🛡️ 2. لوحة المشرف المستقلة (مراجعة البلاغات والإعلانات والحذف المباشر) */}
            {currentTab === 'supervisor_panel' && (currentUser.role === 'supervisor' || currentUser.role === 'owner') && (
              <div className="space-y-6">
                <div className="bg-blue-600 text-white p-6 rounded-xl shadow-md">
                  <h2 className="text-xl font-black">🛡️ لوحة إدارة المشرف</h2>
                  <p className="text-xs opacity-90">مراجعة البلاغات وحذف الإعلانات المخالفة لمهمة ضبط الجودة</p>
                </div>

                <div className="bg-white p-5 rounded-xl shadow-sm border space-y-4">
                  <h3 className="font-bold text-gray-800 text-sm">🚩 البلاغات الواردة من المستخدمين ({reports.length})</h3>
                  {reports.length > 0 ? (
                    <div className="space-y-3">
                      {reports.map((rep, index) => (
                        <div key={index} className="bg-red-50 border border-red-200 p-4 rounded-xl flex flex-wrap justify-between items-center gap-2 text-xs">
                          <div>
                            <span className="font-bold text-red-700 bg-red-100 px-2 py-0.5 rounded ml-2">سبب البلاغ: {rep.reason}</span>
                            <span className="text-gray-800 font-bold">الإعلان: {rep.listingTitle}</span>
                          </div>
                          <div className="flex gap-2">
                            <button 
                              onClick={() => handleDeleteListing(rep.listingId)} 
                              className="bg-red-600 text-white font-bold px-3 py-1.5 rounded hover:bg-red-700"
                            >
                              🗑️ حذف الإعلان فوراً
                            </button>
                          </div>
                        </div>
                      ))}
                    </div>
                  ) : (
                    <p className="text-xs text-gray-500 text-center py-4">لا توجد بلاغات مخالفة بحاجة للمراجعة حالياً ✅</p>
                  )}
                </div>
              </div>
            )}

            {/* 🏠 3. الصفحة الرئيسية واجهاتها الإعلانية والبحث */}
            {currentTab === 'home' && (
              <div className="space-y-4">
                {/* 🔍 الفلاتر والبحث المتقدم */}
                <div className="bg-white p-4 rounded-xl shadow-sm space-y-3 border">
                  <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                    <input
                      type="text"
                      placeholder="ابحث عن خدمة (تكييف، نقل)..."
                      value={searchQuery}
                      onChange={(e) => setSearchQuery(e.target.value)}
                      className="border p-2.5 rounded-lg text-sm bg-gray-50"
                    />

                    <select
                      value={selectedRegion}
                      onChange={(e) => { setSelectedRegion(e.target.value); setSelectedCity(''); }}
                      className="border p-2.5 rounded-lg text-sm bg-gray-50"
                    >
                      <option value="">جميع المناطق</option>
                      {SAUDI_REGIONS.map((r) => <option key={r.id} value={r.name}>{r.name}</option>)}
                    </select>

                    <select
                      value={selectedCity}
                      onChange={(e) => setSelectedCity(e.target.value)}
                      disabled={!selectedRegion}
                      className="border p-2.5 rounded-lg text-sm bg-gray-50 disabled:bg-gray-200"
                    >
                      <option value="">جميع المحافظات</option>
                      {activeRegionObj && activeRegionObj.cities.map((c, i) => <option key={i} value={c}>{c}</option>)}
                    </select>
                  </div>
                </div>

                {/* 📋 عرض الإعلانات مع أزرار الحذف والواتساب والخرائط والتقييم */}
                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  {filteredListings.length > 0 ? (
                    filteredListings.map((item) => (
                      <div key={item.id} className="bg-white p-5 rounded-xl shadow-sm border space-y-3 flex flex-col justify-between">
                        <div className="space-y-2">
                          <div className="flex justify-between items-start gap-2">
                            <h3 
                              onClick={() => setSelectedListing(item)}
                              className="font-bold text-gray-800 text-lg hover:text-blue-600 cursor-pointer"
                            >
                              {item.title}
                            </h3>
                            <div className="flex items-center gap-1">
                              <span className="text-green-700 font-black bg-green-50 px-2.5 py-1 rounded text-sm">{item.price} ر.س</span>
                              
                              {/* 🗑️ زر الحذف الذكي المتاح للمستخدم أو المشرف أو المالك */}
                              <button
                                onClick={() => handleDeleteListing(item.id)}
                                title="حذف الإعلان"
                                className="bg-gray-100 hover:bg-red-50 text-gray-400 hover:text-red-600 p-1.5 rounded-lg transition text-xs"
                              >
                                🗑️
                              </button>
                            </div>
                          </div>

                          <div className="flex items-center gap-2 text-xs">
                            <span className="text-amber-500 font-bold">⭐ {item.avg_rating || 'جديد'}</span>
                            <span className="text-gray-400">({item.reviews_count} تقييم)</span>
                          </div>

                          <p className="text-gray-600 text-sm line-clamp-2">{item.description}</p>
                          <div className="text-xs text-gray-500 font-medium">📍 {item.region} - {item.city}</div>
                        </div>

                        <div className="space-y-2 pt-2 border-t">
                          <div className="flex gap-2">
                            <button
                              onClick={() => setSelectedListing(item)}
                              className="flex-1 bg-blue-50 text-blue-600 hover:bg-blue-100 text-xs py-2 rounded-lg font-bold transition"
                            >
                              🔍 التفاصيل والتقييمات
                            </button>
                            
                            <button
                              onClick={() => setReportingListing(item)}
                              className="bg-red-50 text-red-500 hover:bg-red-100 text-xs px-3 py-2 rounded-lg font-bold transition"
                            >
                              🚩 إبلاغ
                            </button>
                          </div>

                          <div className="flex gap-2">
                            {item.lat && item.lng ? (
                              <a
                                href={`https://www.google.com/maps/search/?api=1&query=${item.lat},${item.lng}`}
                                target="_blank" rel="noreferrer"
                                className="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-800 text-xs py-2 rounded-lg font-bold text-center transition"
                              >
                                📍 الخريطة
                              </a>
                            ) : (
                              <span className="flex-1 bg-gray-50 text-gray-400 text-xs py-2 rounded-lg text-center">لا توجد إحداثيات</span>
                            )}
                            <a
                              href={`https://wa.me/${item.phone}?text=${encodeURIComponent(`السلام عليكم، أستفسر عن إعلان: ${item.title}`)}`}
                              target="_blank" rel="noreferrer"
                              className="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white text-xs py-2 rounded-lg font-bold text-center transition"
                            >
                              📲 واتساب
                            </a>
                          </div>
                        </div>
                      </div>
                    ))
                  ) : (
                    <div className="col-span-full bg-white p-8 rounded-xl text-center text-gray-500 space-y-2 border">
                      <p className="font-bold text-base">لا توجد إعلانات مطابقة لخيارات البحث.</p>
                    </div>
                  )}
                </div>
              </div>
            )}

          </main>

          {/* 🔐 1. نافذة تسجيل الدخول للمالك والمشرف */}
          {showAuthModal && (
            <div className="fixed inset-0 bg-black/50 flex justify-center items-center p-4 z-50">
              <div className="bg-white rounded-xl p-6 max-w-sm w-full space-y-4 shadow-2xl">
                <h3 className="font-bold text-gray-800 text-center">
                  دخول {showAuthModal === 'owner' ? '👑 المالك' : '🛡️ المشرف'}
                </h3>
                <p className="text-xs text-gray-500 text-center">أدخل كلمة المرور التجريبية (1234)</p>
                <input 
                  type="password" 
                  id="passInput"
                  placeholder="كلمة المرور" 
                  className="w-full border p-2 rounded text-sm text-center" 
                />
                <button
                  onClick={() => handleLogin(showAuthModal, document.getElementById('passInput').value)}
                  className="w-full bg-blue-600 text-white py-2 rounded text-sm font-bold"
                >
                  دخول
                </button>
                <button onClick={() => setShowAuthModal(null)} className="w-full text-xs text-gray-400">إلغاء</button>
              </div>
            </div>
          )}

          {/* ➕ 2. نافذة إضافة إعلان مع GPS */}
          {isCreateOpen && (
            <CreateListingModal
              onClose={() => setIsCreateOpen(false)}
              onSubmit={handleAddListing}
              userCoords={userCoords}
            />
          )}

          {/* ⭐ 3. نافذة التفاصيل والتقييمات */}
          {selectedListing && (
            <ListingDetailsModal
              listing={selectedListing}
              onClose={() => setSelectedListing(null)}
              onAddReview={handleAddReview}
              onDelete={handleDeleteListing}
            />
          )}

          {/* 🚩 4. نافذة البلاغات */}
          {reportingListing && (
            <ReportModal
              listing={reportingListing}
              onClose={() => setReportingListing(null)}
              onSubmitReport={handleAddReport}
            />
          )}

        </div>
      );
    }

    // --- مكون إضافة إعلان ---
    function CreateListingModal({ onClose, onSubmit, userCoords }) {
      const [title, setTitle] = useState('');
      const [price, setPrice] = useState('');
      const [phone, setPhone] = useState('966');
      const [selectedRegion, setSelectedRegion] = useState('');
      const [selectedCity, setSelectedCity] = useState('');
      const [description, setDescription] = useState('');
      const [coords, setCoords] = useState(userCoords);

      const activeRegionObj = SAUDI_REGIONS.find((r) => r.name === selectedRegion);

      const handleGetGPS = () => {
        if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition((pos) => {
            setCoords({ lat: pos.coords.latitude, lng: pos.coords.longitude });
            alert('تم التقاط موقعك الحالي بنجاح ✅');
          });
        }
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        onSubmit({
          id: Date.now(),
          title,
          price: parseFloat(price),
          phone,
          region: selectedRegion,
          city: selectedCity,
          description,
          lat: coords?.lat || null,
          lng: coords?.lng || null,
          avg_rating: 0,
          reviews_count: 0,
          reviews: []
        });
        onClose();
      };

      return (
        <div className="fixed inset-0 bg-black/50 flex justify-center items-center p-4 z-50 overflow-y-auto">
          <div className="bg-white rounded-xl p-6 max-w-md w-full shadow-2xl space-y-4 my-8">
            <div className="flex justify-between items-center border-b pb-2">
              <h3 className="font-bold text-gray-800">إضافة إعلان جديد</h3>
              <button onClick={onClose} className="text-gray-400 font-bold">✕</button>
            </div>

            <form onSubmit={handleSubmit} className="space-y-3">
              <input
                type="text" placeholder="عنوان الخدمة" value={title}
                onChange={(e) => setTitle(e.target.value)} required
                className="w-full border p-2 rounded text-sm"
              />
              <div className="grid grid-cols-2 gap-2">
                <input
                  type="number" placeholder="السعر (ريال)" value={price}
                  onChange={(e) => setPrice(e.target.value)} required
                  className="w-full border p-2 rounded text-sm"
                />
                <input
                  type="text" placeholder="رقم الواتساب (966...)" value={phone}
                  onChange={(e) => setPhone(e.target.value)} required
                  className="w-full border p-2 rounded text-sm dir-ltr text-right"
                />
              </div>

              <div className="grid grid-cols-2 gap-2">
                <select value={selectedRegion} onChange={(e) => { setSelectedRegion(e.target.value); setSelectedCity(''); }} required className="border p-2 rounded text-sm">
                  <option value="">اختر المنطقة...</option>
                  {SAUDI_REGIONS.map((r) => <option key={r.id} value={r.name}>{r.name}</option>)}
                </select>
                <select value={selectedCity} onChange={(e) => setSelectedCity(e.target.value)} disabled={!selectedRegion} required className="border p-2 rounded text-sm">
                  <option value="">اختر المحافظة...</option>
                  {activeRegionObj && activeRegionObj.cities.map((c, i) => <option key={i} value={c}>{c}</option>)}
                </select>
              </div>

              <button type="button" onClick={handleGetGPS} className="w-full bg-emerald-50 text-emerald-700 py-2 rounded text-xs font-bold border border-emerald-300">
                {coords ? '✅ تم التقاط موقع الـ GPS' : '🎯 التقاط موقع الإعلان الحالي (GPS)'}
              </button>

              <textarea placeholder="التفاصيل..." value={description} onChange={(e) => setDescription(e.target.value)} required className="w-full border p-2 rounded text-sm" rows="3"></textarea>

              <button type="submit" className="w-full bg-blue-600 text-white py-2.5 rounded-lg text-sm font-bold">نشر الإعلان</button>
            </form>
          </div>
        </div>
      );
    }

    // --- مكون تفاصيل الإعلان والتقييمات ---
    function ListingDetailsModal({ listing, onClose, onAddReview, onDelete }) {
      const [userName, setUserName] = useState('');
      const [rating, setRating] = useState(5);
      const [comment, setComment] = useState('');

      const handleReviewSubmit = (e) => {
        e.preventDefault();
        onAddReview(listing.id, {
          id: Date.now(),
          user: userName,
          rating: Number(rating),
          comment
        });
        setUserName('');
        setComment('');
        alert('تمت إضافة تقييمك بنجاح ⭐');
      };

      return (
        <div className="fixed inset-0 bg-black/50 flex justify-center items-center p-4 z-50 overflow-y-auto">
          <div className="bg-white rounded-xl p-6 max-w-xl w-full shadow-2xl space-y-4 my-8 max-h-[90vh] overflow-y-auto">
            <div className="flex justify-between items-center border-b pb-2">
              <h2 className="font-bold text-xl text-gray-800">{listing.title}</h2>
              <div className="flex items-center gap-2">
                <button 
                  onClick={() => onDelete(listing.id)}
                  className="bg-red-50 text-red-600 text-xs px-2 py-1 rounded font-bold hover:bg-red-100"
                >
                  🗑️ حذف الإعلان
                </button>
                <button onClick={onClose} className="text-gray-400 font-bold text-lg">✕</button>
              </div>
            </div>

            <div className="space-y-2">
              <div className="flex justify-between items-center">
                <span className="text-green-700 font-bold text-lg">{listing.price} ريال</span>
                <span className="text-xs bg-gray-100 px-2 py-1 rounded">📍 {listing.region} - {listing.city}</span>
              </div>
              <p className="text-gray-700 text-sm leading-relaxed border-b pb-3">{listing.description}</p>
            </div>

            <div className="space-y-3">
              <h3 className="font-bold text-gray-800 text-sm">⭐ آراء وتقييمات العملاء ({listing.reviews_count})</h3>
              <div className="space-y-2 max-h-40 overflow-y-auto pr-1">
                {listing.reviews && listing.reviews.length > 0 ? (
                  listing.reviews.map((rev) => (
                    <div key={rev.id} className="bg-gray-50 p-3 rounded-lg border text-xs space-y-1">
                      <div className="flex justify-between">
                        <span className="font-bold text-gray-700">{rev.user}</span>
                        <span className="text-amber-500">{"★".repeat(Math.floor(rev.rating))}</span>
                      </div>
                      <p className="text-gray-600">{rev.comment}</p>
                    </div>
                  ))
                ) : (
                  <p className="text-xs text-gray-400">لا توجد تقييمات حتى الآن.</p>
                )}
              </div>
            </div>

            <form onSubmit={handleReviewSubmit} className="border-t pt-3 space-y-2">
              <h4 className="font-bold text-xs text-gray-700">أضف تقييمك:</h4>
              <div className="grid grid-cols-2 gap-2">
                <input
                  type="text" placeholder="اسمك" value={userName}
                  onChange={(e) => setUserName(e.target.value)} required
                  className="border p-2 rounded text-xs"
                />
                <select value={rating} onChange={(e) => setRating(e.target.value)} className="border p-2 rounded text-xs bg-white">
                  <option value="5">⭐⭐⭐⭐⭐ (5/5)</option>
                  <option value="4">⭐⭐⭐⭐ (4/5)</option>
                  <option value="3">⭐⭐⭐ (3/5)</option>
                  <option value="2">⭐⭐ (2/5)</option>
                  <option value="1">⭐ (1/5)</option>
                </select>
              </div>
              <textarea
                placeholder="تعليقك..." value={comment}
                onChange={(e) => setComment(e.target.value)} required
                className="w-full border p-2 rounded text-xs" rows="2"
              ></textarea>
              <button type="submit" className="w-full bg-amber-500 text-white py-2 rounded text-xs font-bold hover:bg-amber-600">
                إرسال التقييم
              </button>
            </form>
          </div>
        </div>
      );
    }

    // --- مكون نافذة البلاغات ---
    function ReportModal({ listing, onClose, onSubmitReport }) {
      const [reason, setReason] = useState('محتوى غير لائق');

      const handleSubmit = (e) => {
        e.preventDefault();
        onSubmitReport({
          listingId: listing.id,
          listingTitle: listing.title,
          reason
        });
        onClose();
      };

      return (
        <div className="fixed inset-0 bg-black/50 flex justify-center items-center p-4 z-50">
          <div className="bg-white rounded-xl p-6 max-w-sm w-full shadow-2xl space-y-3">
            <div className="flex justify-between items-center border-b pb-2">
              <h3 className="font-bold text-red-600 text-sm">🚩 إبلاغ عن إعلان مخالف</h3>
              <button onClick={onClose} className="text-gray-400 font-bold">✕</button>
            </div>
            <p className="text-xs text-gray-500">الإعلان: <strong className="text-gray-800">{listing.title}</strong></p>

            <form onSubmit={handleSubmit} className="space-y-3">
              <select value={reason} onChange={(e) => setReason(e.target.value)} className="w-full border p-2 rounded text-xs bg-white">
                <option value="محتوى غير لائق">محتوى غير لائق</option>
                <option value="رقم خاطئ أو خادع">رقم خاطئ أو خادع</option>
                <option value="خدمة محظورة">خدمة محظورة</option>
              </select>

              <button type="submit" className="w-full bg-red-600 text-white py-2 rounded text-xs font-bold hover:bg-red-700">
                إرسال البلاغ
              </button>
            </form>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
