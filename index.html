<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>منصة BEST (أفضل) - المنصة الذكية للخدمات الإعلانية</title>
  
  <!-- إعدادات تطبيق الجوال PWA -->
  <meta name="theme-color" content="#2563eb">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  
  <!-- Tailwind CSS للتصميم -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- مكتبات React و Babel لتشغيل الكود مباشرة بالمتصفح -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-gray-100 font-sans">

  <!-- العنصر الرئيسي للتطبيق -->
  <div id="root"></div>

  <!-- كود المنصة التفاعلي -->
  <script type="text/babel">
    const { useState, useEffect } = React;

    // 1. بيانات المناطق والمحافظات في المملكة
    const SAUDI_REGIONS = [
      { id: 'jazan', name: 'منطقة جازان', cities: ['جازان', 'أبو عريش', 'صامطة', 'صبيا', 'بيش', 'أحد المسارحة', 'الدرب'] },
      { id: 'riyadh', name: 'منطقة الرياض', cities: ['الرياض', 'الخرج', 'الدرعية', 'المجمعة', 'الدوادمي'] },
      { id: 'makkah', name: 'منطقة مكة المكرمة', cities: ['مكة المكرمة', 'جدة', 'الطائف', 'القنفذة'] },
      { id: 'eastern', name: 'المنطقة الشرقية', cities: ['الدمام', 'الخبر', 'الأحساء', 'الجبيل', 'القطيف'] },
      { id: 'asir', name: 'منطقة عسير', cities: ['أبها', 'خميس مشيط', 'محايل عسير', 'النماص'] },
      { id: 'medina', name: 'منطقة المدينة المنورة', cities: ['المدينة المنورة', 'ينبع', 'العلا'] },
      { id: 'qassim', name: 'منطقة القصيم', cities: ['بريدة', 'عنيزة', 'الرس'] },
      { id: 'tabuk', name: 'منطقة تبوك', cities: ['تبوك', 'ضباء', 'الوجه'] },
      { id: 'hail', name: 'منطقة حائل', cities: ['حائل'] },
      { id: 'najran', name: 'منطقة نجران', cities: ['نجران'] },
      { id: 'baha', name: 'منطقة الباحة', cities: ['الباحة', 'بلجرشي'] },
      { id: 'northern', name: 'منطقة الحدود الشمالية', cities: ['عرعر', 'طريف'] },
      { id: 'jawf', name: 'منطقة الجوف', cities: ['سكاكا', 'القريات'] }
    ];

    // 2. بيانات أولية للتجربة
    const INITIAL_LISTINGS = [
      {
        id: 1,
        title: 'توريد وتركيب أجهزة تكييف سبليت',
        price: 1500,
        region: 'منطقة جازان',
        city: 'أبو عريش',
        description: 'تركيب وصيانة جميع أنواع التكييف بضمان شامل وقطع غيار أصلية.',
        is_featured: true,
        avg_rating: 4.8,
        reviews_count: 12,
        latitude: 16.9691,
        longitude: 42.8314
      },
      {
        id: 2,
        title: 'خدمات نقل العفش والأثاث',
        price: 450,
        region: 'منطقة الرياض',
        city: 'الرياض',
        description: 'دينات مجهزة لنقل الأثاث داخل وخارج الرياض مع الفك والتركيب.',
        is_featured: false,
        avg_rating: 4.5,
        reviews_count: 8,
        latitude: 24.7136,
        longitude: 46.6753
      }
    ];

    // 3. مكون التطبيق الرئيسي
    function App() {
      const [listings, setListings] = useState(INITIAL_LISTINGS);
      const [search, setSearch] = useState('');
      const [selectedRegion, setSelectedRegion] = useState('');
      const [selectedCity, setSelectedCity] = useState('');
      const [radius, setRadius] = useState(10);
      const [useLocationFilter, setUseLocationFilter] = useState(false);
      
      const [isCreateOpen, setIsCreateOpen] = useState(false);
      const [reportListingId, setReportListingId] = useState(null);
      const [reviewListing, setReviewListing] = useState(null);

      const activeRegionObj = SAUDI_REGIONS.find((r) => r.name === selectedRegion);

      const filteredListings = listings.filter((item) => {
        const matchesSearch = item.title.includes(search) || item.description.includes(search);
        const matchesRegion = selectedRegion ? item.region === selectedRegion : true;
        const matchesCity = selectedCity ? item.city === selectedCity : true;
        return matchesSearch && matchesRegion && matchesCity;
      });

      const handleAddListing = (newListing) => {
        setListings([{ id: Date.now(), ...newListing }, ...listings]);
      };

      return (
        <div className="min-h-screen bg-gray-100 p-4 md:p-8">
          {/* الهيدر الرئيسي */}
          <header className="max-w-6xl mx-auto bg-white p-4 rounded-xl shadow-sm mb-6 flex justify-between items-center">
            <div>
              <h1 className="text-2xl font-black text-blue-600">منصة BEST (أفضل)</h1>
              <p className="text-xs text-gray-500">المنصة الذكية للخدمات والإعلانات المباشرة</p>
            </div>
            <button
              onClick={() => setIsCreateOpen(true)}
              className="bg-blue-600 hover:bg-blue-700 text-white text-sm font-bold px-4 py-2 rounded-lg transition"
            >
              + إضافة إعلان / خدمة
            </button>
          </header>

          {/* محرك البحث والفلترة الجغرافية */}
          <main className="max-w-6xl mx-auto space-y-4">
            <div className="bg-white p-4 rounded-xl shadow-sm space-y-3">
              <div className="flex flex-col md:flex-row gap-3">
                <input
                  type="text"
                  placeholder="ابحث عن خدمة أو منتج..."
                  value={search}
                  onChange={(e) => setSearch(e.target.value)}
                  className="border p-2 rounded-lg flex-1 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                />
                <select
                  value={selectedRegion}
                  onChange={(e) => {
                    setSelectedRegion(e.target.value);
                    setSelectedCity('');
                  }}
                  className="border p-2 rounded-lg text-sm bg-white md:w-48"
                >
                  <option value="">جميع المناطق</option>
                  {SAUDI_REGIONS.map((r) => (
                    <option key={r.id} value={r.name}>{r.name}</option>
                  ))}
                </select>
                <select
                  value={selectedCity}
                  onChange={(e) => setSelectedCity(e.target.value)}
                  disabled={!selectedRegion}
                  className="border p-2 rounded-lg text-sm bg-white md:w-48 disabled:bg-gray-100"
                >
                  <option value="">جميع المحافظات</option>
                  {activeRegionObj && activeRegionObj.cities.map((c, i) => (
                    <option key={i} value={c}>{c}</option>
                  ))}
                </select>
              </div>

              <div className="flex items-center justify-between pt-2 border-t text-xs">
                <button
                  onClick={() => setUseLocationFilter(!useLocationFilter)}
                  className={`px-3 py-1.5 rounded-lg font-bold flex items-center gap-1 transition ${
                    useLocationFilter ? 'bg-emerald-600 text-white' : 'bg-gray-100 text-gray-700'
                  }`}
                >
                  🎯 {useLocationFilter ? 'البحث الجغرافي مفعل' : 'تفعيل البحث بالـ GPS بالأقرب'}
                </button>
                {useLocationFilter && (
                  <div className="flex items-center gap-2">
                    <span>نطاق المسافة: {radius} كم</span>
                    <input
                      type="range" min="1" max="50" value={radius}
                      onChange={(e) => setRadius(e.target.value)}
                      className="w-32 h-1 bg-gray-200 rounded appearance-none cursor-pointer"
                    />
                  </div>
                )}
              </div>
            </div>

            {/* شبكة عرض البطاقات */}
            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
              {filteredListings.map((item) => (
                <div key={item.id} className="bg-white p-5 rounded-xl shadow-sm border space-y-3 relative">
                  {item.is_featured && (
                    <span className="bg-amber-100 text-amber-800 text-xs font-bold px-2 py-0.5 rounded border border-amber-200 inline-block mb-1">
                      ⭐ إعلان مميز
                    </span>
                  )}
                  <div className="flex justify-between items-start">
                    <h3 className="font-bold text-gray-800 text-lg">{item.title}</h3>
                    <span className="text-green-600 font-bold bg-green-50 px-2 py-1 rounded text-sm">
                      {item.price} ر.س
                    </span>
                  </div>
                  <p className="text-gray-600 text-sm">{item.description}</p>

                  <div className="flex items-center justify-between text-xs text-gray-500 pt-2 border-t">
                    <span>📍 {item.region} - {item.city}</span>
                    <div className="flex items-center gap-1 text-amber-500 font-bold">
                      ★ {item.avg_rating} <span className="text-gray-400">({item.reviews_count})</span>
                    </div>
                  </div>

                  <div className="flex flex-wrap gap-2 pt-2">
                    {item.latitude && (
                      <button
                        onClick={() => window.open(`https://www.google.com/maps/search/?api=1&query=${item.latitude},${item.longitude}`, '_blank')}
                        className="bg-gray-100 hover:bg-gray-200 text-gray-700 text-xs px-2.5 py-1.5 rounded font-semibold"
                      >
                        🗺️ الخريطة
                      </button>
                    )}
                    <button
                      onClick={() => {
                        const text = encodeURIComponent(`شاهد الخدمة: ${item.title} بسعر ${item.price} ر.س`);
                        window.open(`https://api.whatsapp.com/send?text=${text}`, '_blank');
                      }}
                      className="bg-emerald-50 text-emerald-700 border border-emerald-200 text-xs px-2.5 py-1.5 rounded font-semibold"
                    >
                      📲 واتساب
                    </button>
                    <button
                      onClick={() => setReviewListing(item)}
                      className="bg-amber-50 text-amber-700 border border-amber-200 text-xs px-2.5 py-1.5 rounded font-semibold"
                    >
                      ⭐ تقييم
                    </button>
                    <button
                      onClick={() => setReportListingId(item.id)}
                      className="bg-red-50 text-red-600 border border-red-100 text-xs px-2.5 py-1.5 rounded font-semibold mr-auto"
                    >
                      🚨 بلاغ
                    </button>
                  </div>
                </div>
              ))}
            </div>
          </main>

          {/* النوافذ المنبثقة */}
          {isCreateOpen && (
            <CreateListingModal
              onClose={() => setIsCreateOpen(false)}
              onSubmit={handleAddListing}
            />
          )}

          {reviewListing && (
            <ReviewModal
              item={reviewListing}
              onClose={() => setReviewListing(null)}
            />
          )}

          {reportListingId && (
            <ReportModal
              listingId={reportListingId}
              onClose={() => setReportListingId(null)}
            />
          )}
        </div>
      );
    }

    // نافذة إضافة إعلان
    function CreateListingModal({ onClose, onSubmit }) {
      const [title, setTitle] = useState('');
      const [price, setPrice] = useState('');
      const [selectedRegion, setSelectedRegion] = useState('');
      const [selectedCity, setSelectedCity] = useState('');
      const [description, setDescription] = useState('');
      const [coords, setCoords] = useState(null);

      const activeRegionObj = SAUDI_REGIONS.find((r) => r.name === selectedRegion);

      const handleGetLocation = () => {
        if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition((pos) => {
            setCoords({ lat: pos.coords.latitude, lng: pos.coords.longitude });
            alert('تم التقاط إحداثيات الـ GPS بنجاح ✅');
          });
        }
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        onSubmit({
          title,
          price: parseFloat(price),
          region: selectedRegion,
          city: selectedCity,
          description,
          is_featured: false,
          avg_rating: 5.0,
          reviews_count: 1,
          latitude: coords?.lat,
          longitude: coords?.lng
        });
        onClose();
      };

      return (
        <div className="fixed inset-0 bg-black/50 flex justify-center items-center p-4 z-50">
          <div className="bg-white rounded-xl p-6 max-w-lg w-full shadow-2xl space-y-4">
            <div className="flex justify-between items-center border-b pb-2">
              <h3 className="font-bold text-gray-800">إضافة إعلان جديد</h3>
              <button onClick={onClose} className="text-gray-400 font-bold">✕</button>
            </div>
            <form onSubmit={handleSubmit} className="space-y-3">
              <input
                type="text" placeholder="عنوان الخدمة" value={title}
                onChange={(e) => setTitle(e.target.value)} required
                className="w-full border p-2 rounded text-sm focus:outline-none focus:ring-1 focus:ring-blue-500"
              />
              <input
                type="number" placeholder="السعر (ريال)" value={price}
                onChange={(e) => setPrice(e.target.value)} required
                className="w-full border p-2 rounded text-sm focus:outline-none focus:ring-1 focus:ring-blue-500"
              />
              <div className="grid grid-cols-2 gap-2">
                <select
                  value={selectedRegion} onChange={(e) => { setSelectedRegion(e.target.value); setSelectedCity(''); }}
                  required className="border p-2 rounded text-sm bg-white"
                >
                  <option value="">اختر المنطقة...</option>
                  {SAUDI_REGIONS.map((r) => <option key={r.id} value={r.name}>{r.name}</option>)}
                </select>
                <select
                  value={selectedCity} onChange={(e) => setSelectedCity(e.target.value)}
                  disabled={!selectedRegion} required className="border p-2 rounded text-sm bg-white"
                >
                  <option value="">اختر المحافظة...</option>
                  {activeRegionObj && activeRegionObj.cities.map((c, i) => <option key={i} value={c}>{c}</option>)}
                </select>
              </div>
              <button
                type="button" onClick={handleGetLocation}
                className="w-full bg-emerald-50 text-emerald-700 border border-emerald-300 py-2 rounded text-xs font-bold hover:bg-emerald-100 transition"
              >
                📍 {coords ? 'تم تحديد موقع GPS بنجاح' : 'تحديد موقع الإعلان عبر GPS'}
              </button>
              <textarea
                placeholder="التفاصيل..." value={description}
                onChange={(e) => setDescription(e.target.value)} required
                className="w-full border p-2 rounded text-sm focus:outline-none focus:ring-1 focus:ring-blue-500" rows="3"
              ></textarea>
              <button type="submit" className="w-full bg-blue-600 text-white py-2 rounded text-sm font-bold hover:bg-blue-700 transition">
                نشر الإعلان الآن
              </button>
            </form>
          </div>
        </div>
      );
    }

    // نافذة التقييم
    function ReviewModal({ item, onClose }) {
      return (
        <div className="fixed inset-0 bg-black/50 flex justify-center items-center p-4 z-50">
          <div className="bg-white rounded-xl p-5 max-w-sm w-full text-center space-y-3">
            <h3 className="font-bold text-gray-800">تقييم الخدمة</h3>
            <div className="text-2xl text-amber-400">★★★★★</div>
            <textarea placeholder="اكتب رأيك هنا..." className="w-full border p-2 rounded text-sm" rows="3"></textarea>
            <div className="flex gap-2">
              <button onClick={onClose} className="flex-1 bg-gray-200 py-1.5 rounded text-sm">إلغاء</button>
              <button onClick={() => { alert('تم إرسال تقييمك بنجاح!'); onClose(); }} className="flex-1 bg-amber-500 text-white py-1.5 rounded text-sm font-bold">حفظ</button>
            </div>
          </div>
        </div>
      );
    }

    // نافذة البلاغات
    function ReportModal({ listingId, onClose }) {
      return (
        <div className="fixed inset-0 bg-black/50 flex justify-center items-center p-4 z-50">
          <div className="bg-white rounded-xl p-5 max-w-sm w-full space-y-3">
            <h3 className="font-bold text-red-600">🚨 الإبلاغ عن محتوى</h3>
            <select className="w-full border p-2 rounded text-sm bg-white">
              <option>معلومات مضللة أو سعر غير صحيح</option>
              <option>محتوى غير لائق</option>
              <option>خدمة مخالفة</option>
            </select>
            <div className="flex gap-2 pt-2">
              <button onClick={onClose} className="flex-1 bg-gray-200 py-1.5 rounded text-sm">إلغاء</button>
              <button onClick={() => { alert('تم استلام البلاغ وسيتم مراجعته.'); onClose(); }} className="flex-1 bg-red-600 text-white py-1.5 rounded text-sm font-bold">إرسال</button>
            </div>
          </div>
        </div>
      );
    }

    // تشغيل التطبيق
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
