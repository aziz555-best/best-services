<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>منصة BEST - المنظومة الكاملة</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-gray-100 font-sans">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // --- بيانات المناطق والمحافظات ---
    const SAUDI_REGIONS = [
      { id: 'jazan', name: 'منطقة جازان', cities: ['جازان', 'أبو عريش', 'صامطة', 'صبيا', 'بيش'] },
      { id: 'riyadh', name: 'منطقة الرياض', cities: ['الرياض', 'الخرج', 'الدرعية'] },
      { id: 'makkah', name: 'منطقة مكة المكرمة', cities: ['مكة المكرمة', 'جدة', 'الطائف'] }
    ];

    // --- إعلانات افتراضية ---
    const INITIAL_LISTINGS = [
      {
        id: 1,
        title: 'توريد وتركيب أجهزة تكييف سبليت',
        price: 1500,
        region: 'منطقة جازان',
        city: 'أبو عريش',
        phone: '966500000000',
        description: 'تركيب وصيانة جميع أنواع التكييف بضمان شامل.',
        status: 'approved',
        lat: 16.9691,
        lng: 42.8314,
        avg_rating: 4.8,
        reviews_count: 2,
        reviews: [{ id: 101, user: 'أحمد', rating: 5, comment: 'ممتاز جداً' }]
      }
    ];

    function App() {
      // الأدوار: 'user' (مستخدم)، 'supervisor' (مشرف)، 'owner' (مالك)
      const [currentRole, setCurrentRole] = useState('user'); 
      const [listings, setListings] = useState(INITIAL_LISTINGS);
      const [reports, setReports] = useState([]);
      
      // الفلاتر والبحث
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedRegion, setSelectedRegion] = useState('');
      const [selectedCity, setSelectedCity] = useState('');
      const [userCoords, setUserCoords] = useState(null);

      // النوافذ
      const [isCreateOpen, setIsCreateOpen] = useState(false);
      const [selectedListing, setSelectedListing] = useState(null);
      const [reportingListing, setReportingListing] = useState(null);
      const [loginModalRole, setLoginModalRole] = useState(null);

      useEffect(() => {
        if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition((pos) => {
            setUserCoords({ lat: pos.coords.latitude, lng: pos.coords.longitude });
          });
        }
      }, []);

      const activeRegionObj = SAUDI_REGIONS.find((r) => r.name === selectedRegion);

      const filteredListings = listings.filter((item) => {
        const matchesSearch = item.title.includes(searchQuery) || item.description.includes(searchQuery);
        const matchesRegion = selectedRegion ? item.region === selectedRegion : true;
        const matchesCity = selectedCity ? item.city === selectedCity : true;
        return matchesSearch && matchesRegion && matchesCity;
      });

      const handleAddListing = (newListing) => {
        setListings([newListing, ...listings]);
      };

      const handleDeleteListing = (id) => {
        if (confirm('هل أنت تأكد من حذف هذا الإعلان؟')) {
          setListings(listings.filter(item => item.id !== id));
          if (selectedListing && selectedListing.id === id) setSelectedListing(null);
        }
      };

      const handleAddReport = (report) => {
        setReports([report, ...reports]);
        alert('تم إرسال البلاغ للإدارة والمشرفين بنجاح.');
      };

      return (
        <div className="min-h-screen bg-gray-100 p-4 md:p-8">
          {/* 🔝 الهيدر الرئيسي مع شريط اختيار صفة الدخول */}
          <header className="max-w-6xl mx-auto bg-white p-4 rounded-xl shadow-sm mb-6 flex flex-wrap justify-between items-center gap-4">
            <div>
              <h1 className="text-2xl font-black text-blue-600">منصة BEST</h1>
              <p className="text-xs text-gray-500">
                وضع الدخول الحالي: 
                <span className="font-bold text-blue-600 mr-1">
                  {currentRole === 'user' && '👤 مستخدم / زائر'}
                  {currentRole === 'supervisor' && '🛡️ مشرف النظام'}
                  {currentRole === 'owner' && '👑 المالك'}
                </span>
              </p>
            </div>

            {/* أزرار الدخول حسب الصلاحيات */}
            <div className="flex gap-2 items-center flex-wrap">
              {currentRole === 'user' ? (
                <>
                  <button onClick={() => setLoginModalRole('supervisor')} className="bg-gray-100 hover:bg-gray-200 text-gray-700 text-xs px-3 py-2 rounded-lg font-bold">
                    🔑 دخول المشرف
                  </button>
                  <button onClick={() => setLoginModalRole('owner')} className="bg-amber-50 hover:bg-amber-100 text-amber-700 text-xs px-3 py-2 rounded-lg font-bold border border-amber-200">
                    👑 دخول المالك
                  </button>
                </>
              ) : (
                <button onClick={() => setCurrentRole('user')} className="bg-red-50 text-red-600 text-xs px-3 py-2 rounded-lg font-bold">
                  🚪 تسجيل الخروج
                </button>
              )}

              <button
                onClick={() => setIsCreateOpen(true)}
                className="bg-blue-600 hover:bg-blue-700 text-white text-sm font-bold px-4 py-2 rounded-lg transition"
              >
                + إضافة إعلان
              </button>
            </div>
          </header>

          <main className="max-w-6xl mx-auto space-y-6">

            {/* 👑 لوحة المالك (تظهر فقط عند دخول المالك) */}
            {currentRole === 'owner' && (
              <div className="bg-amber-50 border border-amber-300 p-5 rounded-xl space-y-4">
                <div className="flex justify-between items-center">
                  <h2 className="text-lg font-bold text-amber-900">👑 لوحة تحكم المالك الرئيسية</h2>
                  <span className="text-xs bg-amber-200 text-amber-800 px-2.5 py-1 rounded-full font-bold">إشراف عام</span>
                </div>
                <div className="grid grid-cols-1 md:grid-cols-3 gap-4 text-center">
                  <div className="bg-white p-4 rounded-lg shadow-sm border">
                    <p className="text-xs text-gray-500">إجمالي الإعلانات</p>
                    <p className="text-2xl font-black text-gray-800">{listings.length}</p>
                  </div>
                  <div className="bg-white p-4 rounded-lg shadow-sm border">
                    <p className="text-xs text-gray-500">البلاغات النشطة</p>
                    <p className="text-2xl font-black text-red-600">{reports.length}</p>
                  </div>
                  <div className="bg-white p-4 rounded-lg shadow-sm border">
                    <p className="text-xs text-gray-500">المشرفين النشطين</p>
                    <p className="text-2xl font-black text-emerald-600">3 مشرفين</p>
                  </div>
                </div>
              </div>
            )}

            {/* 🛡️ لوحة المشرف (تظهر عند دخول المشرف أو المالك) */}
            {(currentRole === 'supervisor' || currentRole === 'owner') && (
              <div className="bg-blue-50 border border-blue-200 p-5 rounded-xl space-y-3">
                <h2 className="text-md font-bold text-blue-900">🛡️ لوحة إدارة البلاغات (خاصة بالمشرف والمالك)</h2>
                {reports.length > 0 ? (
                  <div className="space-y-2">
                    {reports.map((rep, idx) => (
                      <div key={idx} className="bg-white p-3 rounded-lg border flex justify-between items-center text-xs">
                        <div>
                          <span className="font-bold text-red-600">بلاغ: </span>
                          <span>{rep.reason} - الإعلان: {rep.listingTitle}</span>
                        </div>
                        <button onClick={() => handleDeleteListing(rep.listingId)} className="bg-red-600 text-white px-2 py-1 rounded font-bold">
                          حذف الإعلان المخالف
                        </button>
                      </div>
                    ))}
                  </div>
                ) : (
                  <p className="text-xs text-gray-500">لا توجد بلاغات معلقة حالياً.</p>
                )}
              </div>
            )}

            {/* 🔍 فلاتر البحث */}
            <div className="bg-white p-4 rounded-xl shadow-sm space-y-3 border">
              <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                <input
                  type="text" placeholder="ابحث عن خدمة..." value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                  className="border p-2.5 rounded-lg text-sm bg-gray-50"
                />
                <select value={selectedRegion} onChange={(e) => { setSelectedRegion(e.target.value); setSelectedCity(''); }} className="border p-2.5 rounded-lg text-sm bg-gray-50">
                  <option value="">جميع المناطق</option>
                  {SAUDI_REGIONS.map((r) => <option key={r.id} value={r.name}>{r.name}</option>)}
                </select>
                <select value={selectedCity} onChange={(e) => setSelectedCity(e.target.value)} disabled={!selectedRegion} className="border p-2.5 rounded-lg text-sm bg-gray-50">
                  <option value="">جميع المحافظات</option>
                  {activeRegionObj && activeRegionObj.cities.map((c, i) => <option key={i} value={c}>{c}</option>)}
                </select>
              </div>
            </div>

            {/* 📋 قائمة الإعلانات */}
            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
              {filteredListings.map((item) => (
                <div key={item.id} className="bg-white p-5 rounded-xl shadow-sm border space-y-3 flex flex-col justify-between">
                  <div className="space-y-2">
                    <div className="flex justify-between items-start">
                      <h3 onClick={() => setSelectedListing(item)} className="font-bold text-gray-800 text-lg cursor-pointer hover:text-blue-600">
                        {item.title}
                      </h3>
                      <div className="flex items-center gap-1">
                        <span className="text-green-700 font-black bg-green-50 px-2 py-1 rounded text-sm">{item.price} ر.س</span>
                        {/* 🗑️ زر الحذف متاحة للجميع ومخصصة للمالك/المشرف */}
                        <button onClick={() => handleDeleteListing(item.id)} className="text-gray-400 hover:text-red-600 p-1 text-xs" title="حذف">🗑️</button>
                      </div>
                    </div>
                    <p className="text-gray-600 text-sm line-clamp-2">{item.description}</p>
                    <div className="text-xs text-gray-500">📍 {item.region} - {item.city}</div>
                  </div>

                  <div className="space-y-2 pt-2 border-t">
                    <div className="flex gap-2">
                      <button onClick={() => setSelectedListing(item)} className="flex-1 bg-blue-50 text-blue-600 text-xs py-2 rounded-lg font-bold">التفاصيل والتقييمات</button>
                      <button onClick={() => setReportingListing(item)} className="bg-red-50 text-red-500 text-xs px-3 py-2 rounded-lg font-bold">🚩 إبلاغ</button>
                    </div>
                    <div className="flex gap-2">
                      {item.lat && <a href={`https://www.google.com/maps/search/?api=1&query=${item.lat},${item.lng}`} target="_blank" className="flex-1 bg-gray-100 text-gray-800 text-xs py-2 rounded-lg font-bold text-center">📍 الخريطة</a>}
                      <a href={`https://wa.me/${item.phone}`} target="_blank" className="flex-1 bg-emerald-600 text-white text-xs py-2 rounded-lg font-bold text-center">📲 واتساب</a>
                    </div>
                  </div>
                </div>
              ))}
            </div>
          </main>

          {/* 🔑 نافذة تسجيل دخول (المشرف / المالك) */}
          {loginModalRole && (
            <div className="fixed inset-0 bg-black/50 flex justify-center items-center p-4 z-50">
              <div className="bg-white rounded-xl p-6 max-w-sm w-full space-y-4">
                <h3 className="font-bold text-gray-800 text-center">
                  دخول {loginModalRole === 'owner' ? '👑 المالك' : '🛡️ المشرف'}
                </h3>
                <input type="text" placeholder="اسم المستخدم" className="w-full border p-2 rounded text-sm" defaultValue={loginModalRole} />
                <input type="password" placeholder="كلمة المرور" className="w-full border p-2 rounded text-sm" defaultValue="123456" />
                <button
                  onClick={() => {
                    setCurrentRole(loginModalRole);
                    setLoginModalRole(null);
                  }}
                  className="w-full bg-blue-600 text-white py-2 rounded text-sm font-bold"
                >
                  تسجيل الدخول
                </button>
                <button onClick={() => setLoginModalRole(null)} className="w-full text-xs text-gray-400">إلغاء</button>
              </div>
            </div>
          )}

          {/* ➕ نافذة إضافة إعلان مع GPS */}
          {isCreateOpen && (
            <CreateModal onClose={() => setIsCreateOpen(false)} onSubmit={handleAddListing} userCoords={userCoords} />
          )}

          {/* 🚩 نافذة إرسال البلاغات */}
          {reportingListing && (
            <ReportModal listing={reportingListing} onClose={() => setReportingListing(null)} onSubmitReport={handleAddReport} />
          )}
        </div>
      );
    }

    // --- مكون نافذة الإضافة ---
    function CreateModal({ onClose, onSubmit, userCoords }) {
      const [title, setTitle] = useState('');
      const [price, setPrice] = useState('');
      const [phone, setPhone] = useState('966');
      const [region, setRegion] = useState('');
      const [city, setCity] = useState('');
      const [desc, setDesc] = useState('');
      const [coords, setCoords] = useState(userCoords);

      const activeReg = SAUDI_REGIONS.find(r => r.name === region);

      return (
        <div className="fixed inset-0 bg-black/50 flex justify-center items-center p-4 z-50">
          <div className="bg-white rounded-xl p-6 max-w-md w-full space-y-3">
            <h3 className="font-bold border-b pb-2">إضافة إعلان جديد</h3>
            <input type="text" placeholder="العنوان" value={title} onChange={e=>setTitle(e.target.value)} className="w-full border p-2 rounded text-sm" />
            <div className="grid grid-cols-2 gap-2">
              <input type="number" placeholder="السعر" value={price} onChange={e=>setPrice(e.target.value)} className="border p-2 rounded text-sm" />
              <input type="text" placeholder="الواتساب" value={phone} onChange={e=>setPhone(e.target.value)} className="border p-2 rounded text-sm" />
            </div>
            <div className="grid grid-cols-2 gap-2">
              <select value={region} onChange={e=>{setRegion(e.target.value); setCity('');}} className="border p-2 rounded text-sm">
                <option value="">المنطقة...</option>
                {SAUDI_REGIONS.map(r => <option key={r.id} value={r.name}>{r.name}</option>)}
              </select>
              <select value={city} onChange={e=>setCity(e.target.value)} disabled={!region} className="border p-2 rounded text-sm">
                <option value="">المحافظة...</option>
                {activeReg && activeReg.cities.map((c,i)=><option key={i} value={c}>{c}</option>)}
              </select>
            </div>
            <textarea placeholder="التفاصيل..." value={desc} onChange={e=>setDesc(e.target.value)} className="w-full border p-2 rounded text-sm" rows="2"></textarea>
            <button
              onClick={() => {
                onSubmit({ id: Date.now(), title, price: parseFloat(price), phone, region, city, description: desc, lat: coords?.lat, lng: coords?.lng });
                onClose();
              }}
              className="w-full bg-blue-600 text-white py-2 rounded font-bold text-sm"
            >
              نشر الإعلان
            </button>
            <button onClick={onClose} className="w-full text-xs text-gray-400">إلغاء</button>
          </div>
        </div>
      );
    }

    // --- مكون البلاغات ---
    function ReportModal({ listing, onClose, onSubmitReport }) {
      const [reason, setReason] = useState('محتوى غير لائق');
      return (
        <div className="fixed inset-0 bg-black/50 flex justify-center items-center p-4 z-50">
          <div className="bg-white rounded-xl p-5 max-w-sm w-full space-y-3">
            <h3 className="font-bold text-red-600 text-sm">إبلاغ عن إعلان</h3>
            <select value={reason} onChange={e => setReason(e.target.value)} className="w-full border p-2 rounded text-xs">
              <option value="محتوى غير لائق">محتوى غير لائق</option>
              <option value="رقم خاطئ">رقم خاطئ أو خادع</option>
            </select>
            <button
              onClick={() => {
                onSubmitReport({ listingId: listing.id, listingTitle: listing.title, reason });
                onClose();
              }}
              className="w-full bg-red-600 text-white py-2 rounded text-xs font-bold"
            >
              إرسال البلاغ
            </button>
            <button onClick={onClose} className="w-full text-xs text-gray-400">إلغاء</button>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
